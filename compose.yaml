services:
  db:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: card
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card -d card"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://card:card@db:5432/card?schema=public
      LOG_SQL: ${LOG_SQL:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'{profile{name}}'})}).then(async r=>{const j=await r.json();process.exit(r.ok&&j.data?.profile?.name?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql://card:card@db:5432/card?schema=integration
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
